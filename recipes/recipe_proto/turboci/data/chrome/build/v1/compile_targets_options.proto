syntax = "proto3";
package turboci.data.chrome.build.v1;

option go_package = "go.chromium.org/turboci/proto/go/data/chrome/build/v1;buildpb";
option java_multiple_files = true;

// Options providing the compile targets that should be provided to the
// toolchain to compile.
message CompileTargetsOptions {
  // The compile targets to compile.
  repeated string compile_targets = 1;
}
