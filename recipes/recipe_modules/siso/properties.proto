syntax = "proto3";

package recipe_modules.build.siso;

// NEXT ID TO USE: 15
message InputProperties {
  // Backend config

  // Cloud project ID to use (for RBE, cloud logging, etc).
  string project = 1;

  // The remote execution service to dial gRPC.
  // Default is "remotebuildexecution.googleapis.com:443" in siso binary.
  string reapi_address = 2;

  // RBE instance name (example: "default_instance").
  string reapi_instance = 3;

  // Features

  // Specify a cache silo key.
  // This allows remote build caches to be segregated.
  // It is useful in cases such as performance testing.
  string action_salt = 4;

  // Siso experiments ids.
  // https://chromium.googlesource.com/infra/infra/+/bdc94f6a432b49b0c8412994c095901f816532b8/go/src/infra/build/siso/build/experiments.go#17
  repeated string experiments = 5;

  // monitoring/observability
  bool enable_cloud_profiler = 6;
  bool enable_cloud_trace = 7;
  // Cloud monitoring feature is available only when using the builtin RBE
  // client. When Siso uses Reclient, Reclient sends metrics to Cloud monitoring
  // instead.
  bool enable_cloud_monitoring = 13;
  // GCP project for Cloud Monitoring.
  string metrics_project = 14;

  // Siso configs passed to Starlark config via `--config`.
  // In chromium, available config can be found at
  // https://chromium.googlesource.com/chromium/src/+/refs/heads/main/build/config/siso/config.star
  reserved 8;
  repeated string configs = 9;

  // The number of remote jobs to run in parallel.
  // The default is calculated by Siso internally.
  int32 remote_jobs = 10;

  // Boolean flag to enable REAPI usage check after build step.
  // This is useful to make sure REAPI is not used in the build.
  bool fail_if_reapi_used = 11;

  // Siso flag for `--output_local_strategy`.
  string output_local_strategy = 12;
}
