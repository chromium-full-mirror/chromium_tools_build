syntax = "proto3";

package recipe_modules.build.ssci;

message InputProperties {
  // bq_artifact_table is the BQ table where artifact rows will be written
  // to it has the form project.dataset.table.
  string bq_artifact_table = 1;

  // bq_library_table is the BQ table where library rows will be written
  // to it has the form project.dataset.table.
  string bq_library_table = 2;

  // depbot_version is the version of the depbot binary to use.
  string depbot_version = 3;

  // target is the entrypoint to the SSCI collection.
  string target = 4;

  // fast mode only collects the full dependency tree not the artifacts.
  bool fast_mode = 5;

  // version of the partybot CIPD module to use
  string partybot_version = 6;

  // bq table for third party dependencies collected during the run
  string bq_thirdparty_table = 7;

  // version of the SSCI CIPD module to use
  string ssci_version = 8;
}