syntax = "proto3";
package recipes.build.perf.crossbench_android;

message InputProperties {
  // To run Android end-to-end tests, you must set android_sdk to instruct
  // the builder to start an Android emulator.
  // See docs/android_emulator.md for a list of available SDKs.
  int32 android_sdk = 1;
  // The path to the test driver to run.
  string test_driver = 2;
}
