syntax = "proto3";

package recipes.build.gofindit.chromium.test_single_revision;

// InputProperties defines the input properties being passed to
// test_single_revision.py recipe.
message InputProperties {
  // Identifies a builder compatible with chromium_tests.
  // We are not using project-bucket-id identifier here because
  // it is not compatible with chromium_tests recipe.
  message BuilderId {
    string group = 1;
    string builder = 2;
  }

  // The builder to run the test on.
  BuilderId target_builder = 1;

  // Test represents the test to rerun.
  message Test {
    // A name from https://cs.chromium.org/chromium/src/testing/buildbot/test_suites.pyl.
    string test_suite_name = 1;
    // The name of the test. Note that it is different from test_id.
    string test_name = 2;
    // Equivalent of luci.resultdb.v1.TestResult.TestId.
    string test_id = 3;
  }
  // The tests to run in this build.
  // When run_all is false, the build will only run tests in this list.
  // When run_all is true, the build will run all tests in each test suite presents in the list.
  // In both cases, this build will only collect and send test results belonging to tests in this list.
  repeated Test tests_to_run = 2;

  // The host to send the result to.
  string bisection_host = 3;

  // Whether to run all tests in each test suites.
  bool run_all = 4;

  // Whether we should remove all builder cache for the rerun.
  bool should_clobber = 5;
}
