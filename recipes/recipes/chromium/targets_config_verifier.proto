syntax = "proto3";

package recipes.build.chromium.targets_config_verifier;

// Next ID: 2
message InputProperties {

  // Required, the directory where the per-builder config files are located
  //
  // The path is relative to the root of the repo. For each builder, the
  // relative path to the test files from the builder config directory must be
  // <bucket>/<builder>/targets/*.json. The corresponding builders must be
  // bootstrapped, with the builder config specified src-side. For each builder,
  // the relative path to the properties file from the builder config directory
  // must be <bucket>/<builder>/properties.json.
  string builder_config_directory = 1;
}
