syntax = "proto3";

package recipes.build.chromium_codesearch_initiator;

message InputProperties {
  // Codesearch builders to trigger.
  repeated string builders = 1;

  // A codesearch repo, e.g.
  // https://chromium.googlesource.com/codesearch/chromium/src/
  string source_repo = 2;

  // Defines if source_repo uses synthetic commits (e.g. it's a codesearch
  // mirror repo like codesearch/chromium/src).
  bool no_synthetic_commit = 3;

  // Defines if we use git or GoB API to get the revision information.
  bool fetch_revision_from_gob = 4;
}
