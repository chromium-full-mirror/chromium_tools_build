syntax = "proto3";

package recipes.build.art;

message InputProperties {
  // What target device to build for. If unset, the recipe will run in host mode.
  string device = 2;

  // Which repo manifest branch to use. If unset, default is 'master-art'.
  string manifest_branch = 4;

  // Whether to boot up a virtual machine before running tests.
  bool on_virtual_machine = 10;

  // Whether to exit early after building or run the full test suite.
  // Used as an intermediary while builds are functional but tests are not.
  bool build_only = 11;

  // The TARGET_PRODUCT to build for.
  string product = 12;

  // Base url to use for checkout.
  string repo_root = 14;

  message TestStep {
    string name = 1;
    repeated string cmd = 2;
    map<string, string> env = 3;
  }

  // List of test steps to run.
  repeated TestStep test_steps = 16;

  // Environment variables to be used.
  map<string, string> test_env = 17;

  // Optional build_only subbuilder that compiles on behalf of this build
  // (e.g. "target.arm.build_only.64"). The subbuild is always pinned to a
  // commit (ART HEAD if the build has none), and this property is cleared in
  // the subbuild request to prevent recursion.
  // Ignored (incompatible) unless the 'art.superproject' experiment is set,
  // since the repo checkout can not be pinned to a commit.
  string gce_subbuilder = 18;

  // Directories in out/ to archive for target builds.
  repeated string output_directories = 19;
}
